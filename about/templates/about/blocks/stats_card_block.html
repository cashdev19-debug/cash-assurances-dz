{% load wagtailcore_tags wagtailimages_tags navigation_tags %}
<section class="flex justify-center bg-white text-cash font-WixMadefor py-10 md:py-25 px-5">
  <div class="">
    <div class="text-center mb-12 px-4">
      <p class="text-sm font-semibold tracking-widest text-cash uppercase mb-3">{{ self.title }}</p>
      <h2 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-gray-900 leading-tight">{{ self.subtitle }}</h2>
    </div>
    <div class="flex flex-wrap justify-center items-center gap-5 mb-20">
      
        {% for card in self.chiffre %}
      <div class="flex justify-center items-center gap-6 border border-black/30 shadow rounded-2xl p-6 hover:bg-cash/10 hover:shadow-2xl">
        <div class="bg-cash rounded-lg p-2.5 text-white">
          {% svg_icon name=card.icon fill="none" classname="size-5"%}

        </div>
        <div  x-data="{ 
    counter: 0, 
    target: 51.5, 
    duration: 1500, 
    init() {
      let step = Math.ceil(this.target / (this.duration / 15));
      let timer = setInterval(() => {
        this.counter += step;
        if (this.counter >= this.target) {
          this.counter = this.target;
          clearInterval(timer);
        }
      }, 15);
    } 
  }" >
  <p class="text-[14px] sm:text-[18px] font-semibold text-slate-600 leading-4 sm:leading-7.5" >{{ card.title }}</p>
  <h1 class="text-[18px] sm:text-[36px] text-black font-bold tracking-[-0.36px] leading-6 sm:leading-11.5 mb-0.5"><span x-text="counter">0</span><span class="text-sm px-2 text-cash">d'indemnisation au cours des 05 dernières années</span></h1>
          <p class="text-[14px] sm:text-[18px] text-cash leading-4 sm:leading-7.5">{{ card.subtitle }}</p>
        </div>
      </div>

        {% endfor %}
    </div>
  </div>
</section>
