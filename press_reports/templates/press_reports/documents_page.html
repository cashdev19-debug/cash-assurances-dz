{% extends 'base.html' %}
{% load static wagtailcore_tags wagtailimages_tags navigation_tags %}
{% block content %}
  <section>
    <div class="max-w-full p-10 mx-auto text-center bg-gray-100">
      <h2 class="text-black text-3xl font-bold mb-6 md:text-4xl dark:text-cash-50">{{ self.title }}</h2>
      <p class="text-slate-600 text-base leading-relaxed dark:text-slate-400">{{ self.subtitle }}</p>
    </div>
    <div class="max-w-6xl mx-auto my-5">
      <div class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 my-10">
          {% for category in sorted_documents %}
            {% include_block category %}
          {% endfor %}
        </div>
      </div>
    </div>
  </section>
{% endblock %}
