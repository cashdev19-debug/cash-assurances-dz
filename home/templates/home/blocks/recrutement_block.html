{% load wagtailcore_tags wagtailimages_tags navigation_tags %}
{% spaceless %}
<section>
<div class="flex justify-center max-md:p-1">
  <div class="max-md:grid flex container bg-[linear-gradient(90deg,color-mix(in_srgb,#971d20,transparent_92%),transparent)] border border-dashed border-[color-mix(in_srgb,#292929,transparent_80%)] my-10 rounded-3xl p-10 items-center gap-3">
    <div class="flex items-center justify-center rounded-full bg-cash/30 text-cash w-13 h-13">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-briefcase size-7" viewBox="0 0 16 16">
        <path d="M6.5 1A1.5 1.5 0 0 0 5 2.5V3H1.5A1.5 1.5 0 0 0 0 4.5v8A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 14.5 3H11v-.5A1.5 1.5 0 0 0 9.5 1zm0 1h3a.5.5 0 0 1 .5.5V3H6v-.5a.5.5 0 0 1 .5-.5m1.886 6.914L15 7.151V12.5a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5V7.15l6.614 1.764a1.5 1.5 0 0 0 .772 0M1.5 4h13a.5.5 0 0 1 .5.5v1.616L8.129 7.948a.5.5 0 0 1-.258 0L1 6.116V4.5a.5.5 0 0 1 .5-.5" />
      </svg>
    </div>
    <div class="flex-1">
      <h1 class="text-[20px] font-extrabold">{{ self.title }}</h1>
      <p class="text-gray-600 font-medium">{{ self.text|safe }}</p>
    </div>
    <button class="btn group rounded-3xl bg-cash p-6 text-[15px] text-white border-transparent hover:bg-white hover:border-solid hover:border hover:border-cash hover:text-cash">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrow-up-circle group-hover:scale-120" viewBox="0 0 16 16">
        <path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-7.5 3.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707z" />
      </svg>{{ self.link_text }}  
    </button>
  </div>
</div>
</section>

{% endspaceless %}
