
<div class="bg-white p-5 border border-gray-200 shadow-sm rounded-3xl">
  <h3 class="text-xs font-bold uppercase tracking-wider text-gray-900 mb-4 pb-2 border-b border-gray-100">Articles récents</h3>
  <div class="space-y-4">
    {% for post in related_posts %}
      <a href="{% pageurl post %}" class="group flex items-start gap-3">
        <div class="w-16 h-16 shrink-0 overflow-hidden rounded-xl">
          {% picture post.cover_image width - 400 class='w-full h-full object-cover group-hover:scale-105 transition duration-300' %}
        </div>
        <div class="flex flex-col">
          <h4 class="text-xs font-bold text-gray-900 leading-snug line-clamp-2 group-hover:text-gray-600 transition">{{ post.title }}</h4>
          <span class="text-[10px] text-gray-400 mt-1">{{ post.date }}</span>
        </div>
      </a>
    {% endfor %}
  </div>
</div>
