{% extends 'base.html' %}
{% load static %}
{% load wagtailcore_tags wagtailimages_tags navigation_tags %}
{% block content %}
  <section>
    <div class="max-w-full p-10 mx-auto text-center bg-gray-100">
      <h2 class="text-black text-3xl font-bold mb-6 md:text-4xl ">{{ self.title }}</h2>
      <p class="text-slate-600 text-base leading-relaxed ">{{ self.subtitle }}</p>
    </div>
    {% for oneSlide in page.sections %}
      {% include_block oneSlide %}
    {% endfor %}
  </section>
{% endblock %}
